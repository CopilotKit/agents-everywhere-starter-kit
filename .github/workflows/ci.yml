name: Verify starter kit

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  starter-kit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm run build --workspace web

  auth0-example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: examples/auth0/package-lock.json
      - run: npm ci --prefix examples/auth0
      - run: npm test --prefix examples/auth0


  mobile-template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci --prefix apps/mobile
      - run: npm run test --prefix apps/mobile
      - run: npm run typecheck --prefix apps/mobile
      - run: npm run bundle:ios --prefix apps/mobile
      - run: npm run bundle:android --prefix apps/mobile
